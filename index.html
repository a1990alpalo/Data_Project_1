<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NYPD Arrest Data Map</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #0f172a;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 16px 24px;
      color: white;
      background: linear-gradient(135deg, #0f172a, #1d4ed8);
    }

    header h1 {
      margin: 0 0 6px;
      font-size: 1.5rem;
    }

    header p {
      margin: 0;
      color: #dbeafe;
      font-size: 0.9rem;
    }

    header a {
      flex-shrink: 0;
      padding: 10px 14px;
      border: 1px solid #93c5fd;
      border-radius: 6px;
      color: white;
      text-decoration: none;
    }

    header a:hover {
      background-color: rgba(255, 255, 255, 0.15);
    }

    iframe {
      flex: 1;
      width: 100%;
      border: 0;
      background-color: white;
    }

    @media (max-width: 700px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <header>
    <div>
      <h1>NYPD Arrest Data Map</h1>
      <p>
        PostgreSQL and Folium analysis |
        January 1–July 2, 2024 |
        63,619 map-ready records
      </p>
    </div>

    <a
      href="https://github.com/a1990alpalo/Data_Project_1"
      target="_blank"
      rel="noopener noreferrer"
    >
      View Repository
    </a>
  </header>

  <iframe
    src="outputs/maps/nypd_postgresql_arrest_map.html"
    title="Interactive NYPD arrest data map"
  ></iframe>
</body>
</html>
